name: Build APK (Flutter / Web ZIP / Link Website)

run-name: Build APK ${{ inputs.mode }} ${{ inputs.app_label }}

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "flutter | web (ZIP website) | url (link website)"
        required: true
        type: choice
        options:
          - flutter
          - web
          - url
      zip_url:
        description: "Link ZIP dari Vercel Blob (mode flutter/web)"
        required: false
        default: ""
        type: string
      site_url:
        description: "Link website https (mode url)"
        required: false
        default: ""
        type: string
      app_label:
        description: "Nama app (mode url, opsional)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MODE: ${{ inputs.mode }}
      ZIP_URL: ${{ inputs.zip_url }}
      SITE_URL: ${{ inputs.site_url }}
      INPUT_LABEL: ${{ inputs.app_label }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi input
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = "url" ]; then
            re='^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~:/%+-]*)?$'
            [[ "$SITE_URL" =~ $re ]] || { echo "::error::Link website tidak valid (wajib https, tanpa spasi atau tanda kutip)"; exit 1; }
          else
            re='^https://[a-zA-Z0-9.-]+\.blob\.vercel-storage\.com/'
            [[ "$ZIP_URL" =~ $re ]] || { echo "::error::Link ZIP harus dari Vercel Blob"; exit 1; }
          fi
          [[ "$MODE" == "flutter" || "$MODE" == "web" || "$MODE" == "url" ]] || { echo "::error::Mode tidak dikenal"; exit 1; }

      - name: Unduh ZIP (maks 2 GB)
        if: env.MODE != 'url'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming src
          curl -fL --retry 3 --max-filesize 2147483648 -o incoming/source.zip "$ZIP_URL"
          unzip -q incoming/source.zip -d src

      - name: Deteksi project dan baca package ID serta nama app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = "flutter" ]; then
            PUBSPEC="$(find src -name pubspec.yaml -not -path '*/build/*' | head -1)"
            if [ -z "$PUBSPEC" ]; then echo "::error::ZIP tidak berisi pubspec.yaml. Build APK hanya untuk project Flutter."; exit 1; fi
            PROJECT_DIR="$(dirname "$PUBSPEC")"
            grep -q "sdk: flutter" "$PUBSPEC" || { echo "::error::pubspec.yaml bukan project Flutter."; exit 1; }
            [ -d "$PROJECT_DIR/android" ] || { echo "::error::Folder android/ tidak ada di project Flutter ini."; exit 1; }
            GRADLE="$(ls "$PROJECT_DIR"/android/app/build.gradle* | head -1)"
            APP_ID="$(grep -E -o 'applicationId[ =]+"[^"]+"' "$GRADLE" | head -1 | sed -E 's/.*"([^"]+)"$/\1/' || true)"
            [ -z "$APP_ID" ] && APP_ID="$(grep -E -o 'namespace[ =]+"[^"]+"' "$GRADLE" | head -1 | sed -E 's/.*"([^"]+)"$/\1/' || true)"
            MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
            APP_LABEL="$(grep -o -E 'android:label="[^"]+"' "$MANIFEST" | head -1 | sed -E 's/.*="([^"]+)"/\1/' || true)"
            if [ -z "$APP_LABEL" ] || [[ "$APP_LABEL" == @string/* ]]; then
              APP_LABEL="$(grep -o -E 'name="app_name">[^<]+' "$PROJECT_DIR/android/app/src/main/res/values/strings.xml" 2>/dev/null | head -1 | sed -E 's/.*>//' || true)"
            fi
            [ -z "$APP_LABEL" ] && APP_LABEL="$(grep -E '^name:' "$PUBSPEC" | sed -E 's/name:[ ]*//')"
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          elif [ "$MODE" = "web" ]; then
            INDEX="$(find src -name index.html -not -path '*/node_modules/*' | head -1)"
            if [ -z "$INDEX" ]; then echo "::error::ZIP tidak berisi index.html. Mode ZIP website butuh index.html."; exit 1; fi
            echo "WEB_SRC=$(dirname "$INDEX")" >> "$GITHUB_ENV"
            APP_LABEL="$(grep -o -i -E '<title>[^<]+' "$INDEX" | head -1 | sed -E 's/<title>//I' || true)"
            [ -z "$APP_LABEL" ] && APP_LABEL="Web App"
            SLUG="$(echo "$APP_LABEL" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9' | cut -c1-30)"
            [ -z "$SLUG" ] && SLUG="app"
            case "$SLUG" in [a-z]*) ;; *) SLUG="a$SLUG" ;; esac
            APP_ID="com.webapp.$SLUG"
          else
            HOST="$(python3 -c 'import os,urllib.parse;print(urllib.parse.urlparse(os.environ["SITE_URL"]).hostname or "")')"
            APP_LABEL="${INPUT_LABEL:-$HOST}"
            SLUG="$(echo "$HOST" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9' | cut -c1-30)"
            [ -z "$SLUG" ] && SLUG="app"
            case "$SLUG" in [a-z]*) ;; *) SLUG="a$SLUG" ;; esac
            APP_ID="com.webapp.$SLUG"
            echo "TARGET_URL=$SITE_URL" >> "$GITHUB_ENV"
          fi
          # Nama dibersihkan agar aman dipakai di XML dan nama file.
          APP_LABEL="$(echo "$APP_LABEL" | tr -d '\r' | tr -cd 'A-Za-z0-9 ._-' | sed -E 's/^ +| +$//g' | cut -c1-40)"
          [ -z "$APP_LABEL" ] && APP_LABEL="App"
          if ! [[ "$APP_ID" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "::error::Package ID tidak valid: '$APP_ID'. Ubah applicationId di build.gradle."; exit 1
          fi
          FILE_LABEL="$(echo "$APP_LABEL" | tr ' ' '-' | tr -cd 'A-Za-z0-9._-')"
          [ -z "$FILE_LABEL" ] && FILE_LABEL="app"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "APP_LABEL=$APP_LABEL" >> "$GITHUB_ENV"
          echo "FILE_LABEL=$FILE_LABEL" >> "$GITHUB_ENV"
          {
            echo "### Terdeteksi"
            echo "- Mode: $MODE"
            echo "- Nama app: $APP_LABEL"
            echo "- Package ID: $APP_ID"
            echo "- Nama file APK: $FILE_LABEL-$APP_ID.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        if: env.MODE != 'flutter'
        with:
          gradle-version: "8.7"

      - uses: subosito/flutter-action@v2
        if: env.MODE == 'flutter'
        with:
          channel: stable
          cache: true

      - name: Build Flutter APK
        if: env.MODE == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --debug

      - name: Susun project WebView dan build (ZIP website / link website)
        if: env.MODE != 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          P=android-app
          PKG_DIR="$P/app/src/main/java/$(echo "$APP_ID" | tr . /)"
          mkdir -p "$PKG_DIR" "$P/app/src/main/assets"
          if [ "$MODE" = "web" ]; then
            cp -r "$WEB_SRC"/. "$P/app/src/main/assets/"
            export TARGET="file:///android_asset/index.html"
          else
            export TARGET="$TARGET_URL"
          fi
          export APP_ID APP_LABEL PKG_DIR
          cat > "$P/settings.gradle" <<'G'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "webview-app"
          include ':app'
          G
          cat > "$P/build.gradle" <<'G'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          G
          python3 - <<'PY'
          import os
          p = os.environ["P"] if "P" in os.environ else "android-app"
          app_id = os.environ["APP_ID"]
          label = os.environ["APP_LABEL"]
          target = os.environ["TARGET"]
          pkg_dir = os.environ["PKG_DIR"]
          open(f"{p}/app/build.gradle", "w").write(f"""plugins {{ id 'com.android.application' }}
          android {{
              namespace '{app_id}'
              compileSdk 34
              defaultConfig {{
                  applicationId '{app_id}'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }}
              compileOptions {{
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }}
          }}
          """)
          open(f"{p}/app/src/main/AndroidManifest.xml", "w").write(f"""<?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application android:label="{label}" android:usesCleartextTraffic="false" android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          """)
          java = """package __PKG__;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private static final String TARGET = "__TARGET__";
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl(TARGET);
                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          """
          java = java.replace("__PKG__", app_id).replace("__TARGET__", target)
          open(f"{pkg_dir}/MainActivity.java", "w").write(java)
          PY
          cd "$P"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Kumpulkan APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          if [ "$MODE" = "flutter" ]; then
            APK="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -name 'app-debug.apk' | head -1)"
          else
            APK="$(find android-app/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          fi
          if [ -z "${APK:-}" ]; then echo "::error::APK tidak ditemukan setelah build"; exit 1; fi
          cp "$APK" "output/${FILE_LABEL}-${APP_ID}.apk"
          ls -lh output

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_LABEL }}-${{ env.APP_ID }}
          path: output/*.apk
          retention-days: 7
