name: Build APK (Flutter / Web to APK)

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "Link ZIP dari Vercel Blob"
        required: true
        type: string
      mode:
        description: "flutter = project Flutter, web = website (WebView)"
        required: true
        type: choice
        options:
          - flutter
          - web

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ZIP_URL: ${{ inputs.zip_url }}
      MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - name: Validasi input
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ZIP_URL" =~ ^https://[a-zA-Z0-9.-]+\.blob\.vercel-storage\.com/ ]] || { echo "::error::Link ZIP harus dari Vercel Blob"; exit 1; }
          [[ "$MODE" == "flutter" || "$MODE" == "web" ]] || { echo "::error::Mode tidak dikenal"; exit 1; }

      - name: Unduh ZIP (maks 2 GB)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p incoming
          curl -fL --retry 3 --max-filesize 2147483648 -o incoming/source.zip "$ZIP_URL"
          ls -lh incoming/source.zip

      - name: Ekstrak ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf src && mkdir src
          unzip -q incoming/source.zip -d src

      - name: Deteksi jenis project dan baca package ID serta nama app
        shell: bash
        run: |
          set -euo pipefail
          if [ "$MODE" = "flutter" ]; then
            PUBSPEC="$(find src -name pubspec.yaml -not -path '*/build/*' | head -1)"
            if [ -z "$PUBSPEC" ]; then
              echo "::error::ZIP tidak berisi pubspec.yaml. Build APK hanya untuk project Flutter."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$PUBSPEC")"
            if ! grep -q "sdk: flutter" "$PUBSPEC"; then
              echo "::error::pubspec.yaml bukan project Flutter (tidak ada 'sdk: flutter')."; exit 1
            fi
            if [ ! -d "$PROJECT_DIR/android" ]; then
              echo "::error::Folder android/ tidak ada di project Flutter ini."; exit 1
            fi
            GRADLE="$(ls "$PROJECT_DIR"/android/app/build.gradle* 2>/dev/null | head -1 || true)"
            APP_ID="$(grep -E -o 'applicationId[ =]+["'"'"'][^"'"'"']+' "$GRADLE" | head -1 | sed -E 's/.*["'"'"']([^"'"'"']+)$/\1/' || true)"
            if [ -z "$APP_ID" ]; then
              APP_ID="$(grep -E -o 'namespace[ =]+["'"'"'][^"'"'"']+' "$GRADLE" | head -1 | sed -E 's/.*["'"'"']([^"'"'"']+)$/\1/' || true)"
            fi
            MANIFEST="$PROJECT_DIR/android/app/src/main/AndroidManifest.xml"
            APP_LABEL="$(grep -o -E 'android:label="[^"]+"' "$MANIFEST" | head -1 | sed -E 's/.*="([^"]+)"/\1/' || true)"
            if [ -z "$APP_LABEL" ] || [[ "$APP_LABEL" == @string/* ]]; then
              APP_LABEL="$(grep -o -E 'name="app_name">[^<]+' "$PROJECT_DIR/android/app/src/main/res/values/strings.xml" 2>/dev/null | head -1 | sed -E 's/.*>//' || true)"
            fi
            if [ -z "$APP_LABEL" ]; then APP_LABEL="$(grep -E '^name:' "$PUBSPEC" | sed -E 's/name:[ ]*//')"; fi
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          else
            INDEX="$(find src -name index.html -not -path '*/node_modules/*' | head -1)"
            if [ -z "$INDEX" ]; then echo "::error::ZIP tidak berisi index.html. Mode Web to APK butuh website."; exit 1; fi
            echo "WEB_SRC=$(dirname "$INDEX")" >> "$GITHUB_ENV"
            APP_LABEL="$(grep -o -i -E '<title>[^<]+' "$INDEX" | head -1 | sed -E 's/<title>//I' | tr -d '\r' || true)"
            if [ -z "$APP_LABEL" ]; then APP_LABEL="Web App"; fi
            SLUG="$(echo "$APP_LABEL" | tr 'A-Z' 'a-z' | tr -cd 'a-z0-9' | cut -c1-30)"
            [ -z "$SLUG" ] && SLUG="app"
            case "$SLUG" in [a-z]*) ;; *) SLUG="a$SLUG" ;; esac
            APP_ID="com.webapp.$SLUG"
          fi
          APP_LABEL="$(echo "$APP_LABEL" | tr -d '\r' | sed -E 's/^ +| +$//g' | cut -c1-40)"
          [ -z "$APP_LABEL" ] && APP_LABEL="App"
          if ! [[ "$APP_ID" =~ ^[a-z][a-z0-9_]*(\.[a-z][a-z0-9_]*)+$ ]]; then
            echo "::error::Package ID tidak valid di ZIP: '$APP_ID'. Ubah applicationId di android/app/build.gradle."
            exit 1
          fi
          FILE_LABEL="$(echo "$APP_LABEL" | tr ' ' '-' | tr -cd 'A-Za-z0-9._-')"
          [ -z "$FILE_LABEL" ] && FILE_LABEL="app"
          echo "APP_ID=$APP_ID" >> "$GITHUB_ENV"
          echo "APP_LABEL=$APP_LABEL" >> "$GITHUB_ENV"
          echo "FILE_LABEL=$FILE_LABEL" >> "$GITHUB_ENV"
          {
            echo "### Terdeteksi dari ZIP"
            echo "- Mode: $MODE"
            echo "- Nama app: $APP_LABEL"
            echo "- Package ID: $APP_ID"
            echo "- Nama file APK: $FILE_LABEL-$APP_ID.apk"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        if: env.MODE == 'web'
        with:
          gradle-version: "8.7"

      - uses: subosito/flutter-action@v2
        if: env.MODE == 'flutter'
        with:
          channel: stable
          cache: true

      - name: Build Flutter APK
        if: env.MODE == 'flutter'
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          flutter --version
          cd "$PROJECT_DIR"
          flutter pub get
          flutter build apk --debug

      - name: Build Web to APK (WebView)
        if: env.MODE == 'web'
        shell: bash
        run: |
          set -euo pipefail
          P=android-app
          mkdir -p "$P/app/src/main/java/app" "$P/app/src/main/assets"
          cp -r "$WEB_SRC"/. "$P/app/src/main/assets/"
          cat > "$P/settings.gradle" <<'G'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name = "webview-app"
          include ':app'
          G
          cat > "$P/build.gradle" <<'G'
          plugins { id 'com.android.application' version '8.5.2' apply false }
          G
          cat > "$P/app/build.gradle" <<G
          plugins { id 'com.android.application' }
          android {
              namespace '$APP_ID'
              compileSdk 34
              defaultConfig {
                  applicationId '$APP_ID'
                  minSdk 21
                  targetSdk 34
                  versionCode 1
                  versionName '1.0'
              }
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          G
          cat > "$P/app/src/main/AndroidManifest.xml" <<G
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="$APP_LABEL"
                  android:usesCleartextTraffic="false"
                  android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          G
          cat > "$P/app/src/main/java/app/MainActivity.java" <<'J'
          package app;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  webView = new WebView(this);
                  WebSettings s = webView.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  s.setAllowFileAccess(true);
                  webView.setWebViewClient(new WebViewClient());
                  webView.loadUrl("file:///android_asset/index.html");
                  setContentView(webView);
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) webView.goBack();
                  else super.onBackPressed();
              }
          }
          J
          cd "$P"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Kumpulkan APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          if [ "$MODE" = "flutter" ]; then
            APK="$(find "$PROJECT_DIR/build/app/outputs/flutter-apk" -name 'app-debug.apk' | head -1)"
          else
            APK="$(find android-app/app/build/outputs/apk/debug -name '*.apk' | head -1)"
          fi
          if [ -z "${APK:-}" ]; then echo "::error::APK tidak ditemukan setelah build"; exit 1; fi
          cp "$APK" "output/${FILE_LABEL}-${APP_ID}.apk"
          ls -lh output

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_LABEL }}-${{ env.APP_ID }}
          path: output/*.apk
          retention-days: 7
